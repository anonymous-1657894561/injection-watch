# E127 (experiments/E127-comply-steering.md): the paper's steering protocol on test. Qwen3.5-9B on high-compliance InjecForks
# realistic test cases; each held-out rollout's first 16 reasoning tokens are kept, and alpha * gap * d is added to layer 20's
# output on every later token (e127_steer.py). d = E093's u (the paper's probe direction) or random directions orthogonal to it.
# Earlier pilots (first-token steering, E127's own direction, sigma units) are in the doc; their configs are at commit 0530b045.
experiment: E127
artifact_repo: anonymous/e79v2-states   # private; rows under out_name/
out_name: e127-paper
dataset_revision: v1.2
upload_every_s: 600
steer: {path: e093/steer.npz, sha256: 99ead71b562e33e138e58e2b61251a10cc508f1a56360106c27bc524d46381d4}   # E093's u and class gap (2.463), as E097
n: 16                    # steering starts after this many reasoning tokens of a held-out rollout
layer: 20                 # E79's frozen comply layer (1-indexed output, as the probe read it)
case_seed: 127
n_cases: 60               # the draw; a run takes its first run_cases
min_eval_strict: 4        # of 8 eval rollouts: 60 test cases qualify (held-out evalextra strict rate 0.44)
run_cases: 60
k: 8                      # prefixes per arm unless the arm says k
rows_per_call: 34         # 68 rows per case in two batches
arms:   # alpha in multiples of the class gap; negative = away from compliance
- {name: c, dir: probe, alpha: 0}
- {name: p-2, dir: probe, alpha: -2}
- {name: p-4, dir: probe, alpha: -4}
- {name: p-8, dir: probe, alpha: -8}
- {name: p+8, dir: probe, alpha: 8}
- {name: r0-2, dir: random0, alpha: -2}
- {name: r0-4, dir: random0, alpha: -4}
- {name: r0-8, dir: random0, alpha: -8, k: 4}
- {name: r1-8, dir: random1, alpha: -8, k: 4}
- {name: r2-8, dir: random2, alpha: -8, k: 4}
generator:
  model_id: Qwen/Qwen3.5-9B
  revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
  quant: bf16
  loader: qwen35_vlm_text
  n_layers: 32
smoke_generator:   # local 6 GB check of every line the pod runs; the 9B tokenizer so the billed-token assertion holds
  model_id: Qwen/Qwen3.5-0.8B
  revision: 2fc06364715b967f1860aea9cf38778875588b17
  tokenizer_id: Qwen/Qwen3.5-9B
  tokenizer_revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
  quant: bf16
  loader: qwen35_vlm_text
  n_layers: 24
smoke_layer: 12
smoke_gap: 2.0
smoke_cases: 1
smoke_max_tokens: 48
smoke_rows_per_call: 17    # the local 6 GB card
config_sha256:
  e127_steer.py: 7ba66d413dcf4be43ae43eafe77019dd73ece535442aabd09898f7dab24058eb
  e112_rollouts.py: 1e4a3b3624391443ede711f15c1780cbd37dbd274b38a12d6f566249b57ad87c
  injecforks_states.py: 0e44a9756ee0f7e2cdae9f65121bb8018812af24413491c6c4fab348fcb4290b
  common.py: e4c45bae1d43fecea51f477c4552c9ce6af60c1d2aacf3403f99a9cf2db8c669
  run_e127_pod.sh: 1321d66a6c0bc4e22a10ab0219a02562945cc9642413e1b1db253f2aaeca8c65
pod:
  script: prototypes/violation-forecast/run_e127_pod.sh
  model_id: Qwen/Qwen3.5-9B
  dtype: bf16
  vram_gib: 40
  container_disk_gb: 80
  volume: false
  cuda_versions: any
  min_cuda: "13.0"           # torch==2.14.0 from PyPI is the cu130 build
  est_hours_reference: 2.0   # 60 cases x 68 rows (away pilot: 16.5 min for 15 x 28 rows): setup ~15 min + per case one 5.8k prefill and <= 28-row decode (replies ~270 tokens, ~480 longest; 4,096 if steering rambles)
  results:
  - prototypes/violation-forecast/results/e127-cloud/*.json
  - prototypes/violation-forecast/results/e127-cloud/stage-logs/*.log
