# E103 agent side on test (experiments/E103-classifier-brittleness.md, 2026-11-11): E79 v2's 9B states on the T2 (casual) and
# T4 (softened) rollouts of the 299 realistic test eval cases x 16 (InjecForks v1.6), so the frozen comply probe can be scored at N = 16
# against T0 (E79 + E113's states). Same model, revision, layers and reads as configs/e103-9b-variants-pod.yaml; only the rows differ.
experiment: E103
out_name: e103-variants-test
artifact_repo: anonymous/e79v2-states
dataset_revision: v1.6
upload_every_s: 600
min_cache_cosine: 0.99   # as E113 (configs/e79v2-9b-evalextra-test.yaml); every row's cosine is in run.json
generator:
  model_id: Qwen/Qwen3.5-9B
  revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
  quant: bf16
  loader: qwen35_vlm_text
  n_layers: 32
d_model: 4096
layers: [8, 12, 16, 20, 24, 26, 28, 30, 32]
ncut: [8, 16]
select:            # test, every row (2 x 4,784)
  realistic-e103T2: {test: all}
  realistic-e103T4: {test: all}
smoke_generator:   # local 6 GB check of every line the pod runs; the 9B tokenizer so the billed-token assertion holds
  model_id: Qwen/Qwen3.5-0.8B
  revision: 2fc06364715b967f1860aea9cf38778875588b17
  tokenizer_id: Qwen/Qwen3.5-9B
  tokenizer_revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
  quant: bf16
  loader: qwen35_vlm_text
  n_layers: 24
smoke_layers: [6, 12, 18, 24]
smoke_d_model: 1024
smoke_cases: 2
config_sha256:
  injecforks_states.py: 2b21035ba12e4a6015a30d0f2badb28124f9bc8541a5b0d8158bf919cd7de34d
  injecforks_load.py: c0d776ec77fe31920ee10f2ae3b8f765b3e9a133b16558d3bb4d0f2696612caa
  common.py: e4c45bae1d43fecea51f477c4552c9ce6af60c1d2aacf3403f99a9cf2db8c669
  run_e103_pod.sh: 2e0b4f8ee04a4a9da196300e1ffd7135a4f5de5cb1989ac6fa20e700644106ad
pod:
  script: prototypes/violation-forecast/run_e103_pod.sh
  model_id: Qwen/Qwen3.5-9B
  dtype: bf16
  vram_gib: 40
  container_disk_gb: 50
  volume: false
  cuda_versions: any
  min_cuda: "13.0"
  est_hours_reference: 0.8   # E113: 299 prompt forwards + 2,392 suffixes, 0.38 h on an H200 incl. setup; here 598 prompts + 9,568 suffixes
  results:
  - prototypes/violation-forecast/results/e79v2-cloud/e103-variants-test/*.json
  - prototypes/violation-forecast/results/e103-cloud/stage-logs/*.log
