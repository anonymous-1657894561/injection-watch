# E79 v2 (experiments/E79-within-prompt-prefix-probes.md): Qwen3.5-9B BF16 residual states along InjecForks v1.2's reasoning.
# Fill config_sha256 (sha256sum of the three files) right before launch; `prep` prints the size of the run.
experiment: E79v2
artifact_repo: anonymous/e79v2-states
dataset_revision: v1.2
upload_every_s: 600
min_cache_cosine: 0.995
generator:
  model_id: Qwen/Qwen3.5-9B
  revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
  quant: bf16
  loader: qwen35_vlm_text
  n_layers: 32
d_model: 4096
layers: [8, 12, 16, 20, 24, 26, 28, 30, 32]
ncut: [8, 16, 32, 64, 128]
select:            # all = every row; eval = the eval-v1.2 rows (test is scored on those only)
  smoke: {train: all, dev: all, test: eval}
  realistic: {train: all, dev: all, test: eval}
  smoke-benign: {train: all, dev: all, test: eval}
  realistic-benign: {train: all, dev: all, test: eval}
smoke_generator:   # local 6 GB check of every line the pod runs; the 9B tokenizer so the billed-token assertion holds
  model_id: Qwen/Qwen3.5-0.8B
  revision: 2fc06364715b967f1860aea9cf38778875588b17
  tokenizer_id: Qwen/Qwen3.5-9B
  tokenizer_revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
  quant: bf16
  loader: qwen35_vlm_text
  n_layers: 24
smoke_layers: [6, 12, 18, 24]
smoke_d_model: 1024
smoke_cases: 2
config_sha256:
  injecforks_states.py: ea7e64367bade96922a7e0030c0e51d66930f434d75f396c685d0b9b473252f9
  common.py: e4c45bae1d43fecea51f477c4552c9ce6af60c1d2aacf3403f99a9cf2db8c669
  run_e79v2_pod.sh: 99796a69a7637b8235a4d3c853b52316a675e7588465f742d34c590492423968
pod:
  script: prototypes/violation-forecast/run_e79v2_pod.sh
  model_id: Qwen/Qwen3.5-9B
  dtype: bf16
  vram_gib: 40
  container_disk_gb: 80
  volume: false              # run_e79v2_pod.sh builds its own venv and downloads the weights: any datacenter (CA-MTL-3 had no stock, 2026-10-25)
  cuda_versions: any         # no RunPod filter, as E81 (newer drivers cannot be named; bootstrap enforces min_cuda)
  min_cuda: "13.0"           # torch==2.14.0 from PyPI is the cu130 build
  est_hours_reference: 1.0   # setup ~15 min + ~3.3k prompt forwards (<= ~8k tokens) + ~26k cached suffixes of <= 128 tokens; see prep
  results:
  - prototypes/violation-forecast/results/e79v2-cloud/*.json
  - prototypes/violation-forecast/results/e79v2-cloud/stage-logs/*.log
